<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工坞</title>
  <link rel="icon" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>工坞</h1>
          <p class="brand-en">TOOLDOCK <span id="ver" class="brand-ver"></span></p>
        </div>
      </div>
      <p class="lede" id="sysline">本机工具停靠处</p>
      <div class="top-actions">
        <input id="q" class="search" placeholder="搜索" autocomplete="off" />
        <button id="btn-select" class="btn" type="button">选择</button>
        <button id="btn-ai" class="btn primary" type="button">发给 AI</button>
        <button id="btn-logs" class="btn" type="button">日志</button>
        <button id="btn-add" class="btn" type="button">注册</button>
      </div>
    </header>

    <p id="sys" class="sysline"></p>
    <datalist id="tab-list"></datalist>

    <nav class="tabbar" id="tabbar" aria-label="标签页"></nav>
    <div id="batchbar" class="batchbar hidden">
      <span id="sel-count">已选 0</span>
      <select id="batch-target"></select>
      <button id="btn-batch-move" class="btn primary" type="button">移入</button>
      <button id="btn-select-all" class="btn" type="button">全选</button>
      <button id="btn-select-clear" class="btn" type="button">清空</button>
    </div>

    <section id="form" class="panel form hidden">
      <h2>注册</h2>
      <div class="grid">
        <label>ID<input id="f-id" placeholder="highspot-sync" /></label>
        <label>名称<input id="f-name" placeholder="AVEVA Highspot 同步" /></label>
        <label>类型
          <select id="f-kind">
            <option value="web">Web 控制台</option>
            <option value="command">命令 / 脚本</option>
            <option value="app">桌面 App</option>
            <option value="url">仅打开网址</option>
          </select>
        </label>
        <label>标签页<input id="f-group" list="tab-list" placeholder="工作 / 财务 / 开发 / 其他" /></label>
        <label class="wide">工作目录<input id="f-workdir" placeholder="/path/to/project" /></label>
        <label class="wide">Git 仓库<input id="f-git" placeholder="https://github.com/org/repo 或 git@github.com:org/repo.git" /></label>
        <label class="wide">启动命令<input id="f-exec" placeholder="python3 server.py" /></label>
        <label>网址<input id="f-url" placeholder="http://localhost:8765" /></label>
        <label>健康检查包含<input id="f-health" placeholder="AVEVA Highspot" /></label>
        <label class="wide">App 路径<input id="f-app" placeholder="/Applications/Foo.app" /></label>
        <label class="check"><input type="checkbox" id="f-mac" checked /> 支援 macOS</label>
        <label class="check"><input type="checkbox" id="f-win" checked /> 支援 Windows</label>
        <label class="check"><input type="checkbox" id="f-term" checked /> 在终端里运行（可看日志 / Ctrl+C）</label>
        <label class="wide">依赖工具 ID<input id="f-depends" placeholder="已注册的 id，逗号分隔" /></label>
        <label class="wide">附加服务（每行一条命令）<textarea id="f-services" rows="3" placeholder="docker compose up -d&#10;python3 worker.py"></textarea></label>
      </div>
      <div class="form-actions">
        <button id="btn-save" class="btn primary" type="button">保存</button>
        <button id="btn-cancel" class="btn" type="button">取消</button>
      </div>
      <p class="hint">Git 填 <code>git remote get-url origin</code>。或点「发给 AI」让助手代注册。</p>
    </section>

    <main id="list" class="list"></main>
    <p id="empty" class="empty hidden">还没有工具。发给 AI，或点注册。</p>
  </div>

  <div id="ai-modal" class="modal hidden" role="dialog" aria-labelledby="ai-title">
    <div class="modal-card">
      <h2 id="ai-title">发给其他 AI</h2>
      <p class="hint">粘贴到 Cursor / Codex。对方读完本机链接就会把当前项目注册进来。</p>
      <label>本机链接
        <input id="ai-url" readonly />
      </label>
      <label>可直接粘贴的说明
        <textarea id="ai-prompt" rows="8" readonly></textarea>
      </label>
      <div class="form-actions">
        <button id="btn-copy-prompt" class="btn primary" type="button">复制说明</button>
        <button id="btn-copy-url" class="btn" type="button">只复制链接</button>
        <button id="btn-open-ai" class="btn" type="button">打开说明书</button>
        <button id="btn-ai-close" class="btn" type="button">关闭</button>
      </div>
      <p id="ai-copied" class="hint hidden">已复制。</p>
    </div>
  </div>

  <div id="log-modal" class="modal hidden" role="dialog" aria-labelledby="log-title">
    <div class="modal-card wide">
      <h2 id="log-title">运行日志</h2>
      <p class="hint" id="log-path"></p>
      <pre id="log-text" class="log-pre">加载中…</pre>
      <div class="form-actions">
        <button id="btn-log-refresh" class="btn primary" type="button">刷新</button>
        <button id="btn-log-copy" class="btn" type="button">复制</button>
        <button id="btn-log-folder" class="btn" type="button">打开文件夹</button>
        <button id="btn-log-close" class="btn" type="button">关闭</button>
      </div>
      <p id="log-copied" class="hint hidden">已复制。</p>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
