version: "2"

run:
  timeout: 3m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - revive
  settings:
    misspell:
      locale: US
    revive:
      severity: warning
      rules:
        - name: var-naming
        - name: error-return
        - name: error-strings
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
    presets:
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
