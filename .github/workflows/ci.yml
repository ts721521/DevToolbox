name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: 编译与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: 测试
        run: go test -race -coverprofile=coverage.out ./...

      - name: 交叉编译抽查
        if: runner.os == 'Linux'
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/dt-darwin .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/dt.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/dt-linux .

  lint:
    name: 代码规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          args: --timeout 5m

  commitlint:
    name: 提交信息
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml
