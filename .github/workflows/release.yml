name: 发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            artifact: devtoolbox-darwin-arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            artifact: devtoolbox-darwin-amd64
            ext: ""
          - goos: windows
            goarch: amd64
            artifact: devtoolbox-windows-amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            artifact: devtoolbox-windows-arm64
            ext: ".exe"
          - goos: linux
            goarch: amd64
            artifact: devtoolbox-linux-amd64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 交叉编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUT="${{ matrix.artifact }}-${VERSION}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w -X github.com/ts721521/DevToolbox/internal/version.Version=${VERSION} -X github.com/ts721521/DevToolbox/internal/version.Commit=${GITHUB_SHA} -X github.com/ts721521/DevToolbox/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "$OUT" .
          ls -lh "$OUT"
          echo "ASSET=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
